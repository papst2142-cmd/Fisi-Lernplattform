# Nur Untersuchung (07.10.2026, Zweig untersuchung-linux-speicher):
# Messungen unter Windows fuer F1 (0.58.1 gegen 0.59.1), F5 (Schliessen)
# und F8 (Speicherspalte). Baut nichts, veroeffentlicht nichts.
# Ergebnisse stehen im Protokoll des Laufs. Wird nie gemergt.
name: Untersuchung Linux-Speicher (nur Messung)

on:
  push:
    branches: [untersuchung-linux-speicher]
    paths: ["untersuchung_linux_speicher/skripte/**", ".github/workflows/untersuchung-linux-speicher.yml"]

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pakete
        run: python -m pip install customtkinter==6.0.0 "pillow>=10" certifi psutil
      - name: Fassungen 0.58.1 und 0.59.1
        run: |
          git worktree add ../v0581 v0.58.1
          git worktree add ../v0591 v0.59.1
      - name: F8 Speicherspalte
        continue-on-error: true
        run: |
          python untersuchung_linux_speicher/skripte/f8_speicher_windows.py ../v0581
          python untersuchung_linux_speicher/skripte/f8_speicher_windows.py ../v0591
      - name: F5 Schliessen
        continue-on-error: true
        run: |
          for v in 0581 0591; do
            for w in 0 2; do
              d="$RUNNER_TEMP/f5_${v}_${w}"; mkdir -p "$d"
              s=$(date +%s.%N)
              MESS_ORDNER="$d" timeout 300 python untersuchung_linux_speicher/skripte/f5_schliessen.py ../v$v "$d/zeiten.txt" $w || echo "Rueckgabe $?"
              e=$(date +%s.%N)
              echo "=== F5 v$v Wechsel $w: Prozess lief insgesamt $(python -c "print(round($e-$s,2))") s"
              cat "$d/zeiten.txt"
              echo "--- fehler.log:"; cat "$d/fehler.log" 2>/dev/null || echo "(keine)"
            done
          done
      - name: F1 Darstellungswechsel
        continue-on-error: true
        run: |
          for r in 1 2; do
            for v in 0581 0591; do
              echo "=== F1 v$v Runde $r"
              MESS_WECHSEL=6 timeout 900 python untersuchung_linux_speicher/skripte/messung_wechsel.py ../v$v "$RUNNER_TEMP/f1_${v}_${r}.json" || echo "Rueckgabe $?"
            done
          done
          for f in "$RUNNER_TEMP"/f1_*.json; do
            echo "=== JSON $f"
            python -c "import json,sys;d=json.load(open(sys.argv[1],encoding='utf-8'));d.pop('messdatei',None);d.pop('vorladen_schritte',None);print(json.dumps(d,ensure_ascii=True))" "$f"
          done
