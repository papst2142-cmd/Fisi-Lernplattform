# Nur Messung (Zweig messung-0631, Plan 0.63.1 Abschnitt 6.5, Teil 1.4): drei
# Staende abwechselnd auf dem Windows-Runner, 7 Runden, je mit und ohne
# Vorladen (FISI_VORLADEN=0), dazu je Runde ein Lauf "erster Wechsel ohne Ruhe"
# (0.63 und 0.63.1, ohne Vorladen):
#   0625 = cf4912b (0.62.5, MESS_FASSUNG=vor)
#   063  = a74712d (0.63,   MESS_FASSUNG=nach)
#   0631 = NACHHER (Integrationsstand 0.63.1, MESS_FASSUNG=nach)
# Baut nichts, veroeffentlicht nichts, wird nie gemergt.
# VOR DEM PUSH: NACHHER unten auf den SHA des Integrationsstands setzen.
name: Messung 0.63.1 (nur Messung)

on:
  push:
    branches: [messung-0631]
    paths: [".github/workflows/messung-0631.yml", "messung_0631/**"]
  workflow_dispatch:

env:
  NACHHER: "35e1b6fd3cb53e3bc421e047c8f639ab7a2bf7ef"

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pakete
        run: python -m pip install customtkinter==6.0.0 "pillow>=10" certifi psutil
      - name: Staende 0625 (cf4912b), 063 (a74712d), 0631 (NACHHER)
        run: |
          git fetch origin main
          git worktree add ../st_0625 cf4912b
          git worktree add ../st_063 a74712d
          git worktree add ../st_0631 "$NACHHER"
          for v in 0625 063 0631; do echo "::notice::Stand $v $(git -C ../st_$v log --oneline -1)"; done
          python -c "import sys, customtkinter, tkinter; print('::notice::Python', sys.version.split()[0], 'customtkinter', customtkinter.__version__, 'Tk', tkinter.TkVersion)"
      - name: Rechner (7 Runden abwechselnd, mit und ohne Vorladen, dazu ohne Ruhe)
        continue-on-error: true
        run: |
          lauf() {  # STAND FASSUNG VORLADEN ART RUNDE
            f="$RUNNER_TEMP/m_$1_$4_$3_$5"
            MESS_STAND=$1 MESS_FASSUNG=$2 FISI_VORLADEN=$3 MESS_ART=$4 timeout 400 python messung_0631/mess_rechner_0631.py ../st_$1 "$f.json" > "$f.txt" 2>&1 || echo "::warning::Lauf $5 $1 $4 $3 Rueckgabe $?"
            grep -h "^ERG\|^ABBRUCH" "$f.txt" || tail -5 "$f.txt"
          }
          for r in 1 2 3 4 5 6 7; do
            for art in normal 0; do
              lauf 0625 vor $art voll $r
              lauf 063 nach $art voll $r
              lauf 0631 nach $art voll $r
            done
            lauf 063 nach 0 ohne_ruhe $r
            lauf 0631 nach 0 ohne_ruhe $r
          done
      - name: Rohwerte (JSON) im Log
        run: |
          for f in "$RUNNER_TEMP"/m_*.json; do
            echo "ROH $(basename "$f") $(python -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1]))))" "$f")"
          done
      - name: Zusammenfassung
        run: python messung_0631/tabelle_0631.py "$RUNNER_TEMP" --notice
