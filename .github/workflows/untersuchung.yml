# Nur fuer die Untersuchung zu Fix 0.55.1 (wird nicht gemergt)
name: Untersuchung Update 0.55.1
on:
  push:
    branches: [untersuchung-update-0551]
jobs:
  windows:
    if: ${{ false }}   # Vorher-Lauf ist erledigt (ergebnisse/vorher)
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: python -m pip install -r requirements.txt
      - name: Installer 0.54 und 0.55 laden
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dl | Out-Null
          foreach ($v in "0.54","0.55") {
            Invoke-WebRequest "https://github.com/papst2142-cmd/Fisi-Lernplattform/releases/download/v$v/FISI-Lernplattform-Setup-$v.exe" -OutFile "dl\Setup-$v.exe"
          }
      - name: Szenarien
        shell: pwsh
        run: untersuchung\szenarien.ps1
      - name: Protokolle in den Zweig schreiben
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ergebnisse/vorher && cp -r protokolle/* ergebnisse/vorher/ || true
          git add ergebnisse && git commit -m "Untersuchung: Protokolle (Lauf ${{ github.run_id }}) [skip ci]" && git pull --rebase && git push || true

  nachher:
    if: ${{ false }}   # erledigt (ergebnisse/nachher, nachher2)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: version-0551
          path: fix
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Abhaengigkeiten
        run: python -m pip install -r fix/requirements-build.txt
      - name: Reparierte Version bauen (Programm + Installer)
        working-directory: fix
        run: python build.py
      - name: Szenarien nachher
        shell: pwsh
        env:
          NUR_FEHLER: "1"
        run: untersuchung\nachher.ps1
      - name: Protokolle in den Zweig schreiben
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ergebnisse/nachher2 && cp -r protokolle_nachher/* ergebnisse/nachher2/ || true
          git add ergebnisse && git commit -m "Untersuchung: Protokolle nachher (Lauf ${{ github.run_id }}) [skip ci]" && git pull --rebase && git push || true

  ubuntu-latest-pruefen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Welche Ubuntu-Version ist ubuntu-latest?
        run: |
          mkdir -p ergebnisse
          { echo "Stand $(date -u +%F' '%T) UTC, Label ubuntu-latest:"; cat /etc/os-release; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"; } > ergebnisse/ubuntu_latest.txt
          cat ergebnisse/ubuntu_latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnisse && git commit -m "Untersuchung: ubuntu-latest [skip ci]" && git pull --rebase && git push
