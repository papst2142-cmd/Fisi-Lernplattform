# Nur Messung (Zweig messung-060, ab 08.10.2026 auch fuer 0.60.1): Zeitleiste
# des Vorladens, Oeffnen von Hilfe/"Farben" und Darstellungswechsel fuer
# 0.59.3, 0.60 und den Zweig version-0601 auf dem Windows-Runner. Baut
# nichts, veroeffentlicht nichts, wird nie gemergt.
name: Messung 0.60.1 (nur Messung)

on:
  push:
    branches: [messung-060]
    paths: [".github/workflows/messung-060.yml", "messung_060/**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pakete
        run: python -m pip install customtkinter==6.0.0 "pillow>=10" certifi psutil
      - name: Fassungen 0.59.3, 0.60 und version-0601
        run: |
          git worktree add ../v0593 v0.59.3
          git worktree add ../v060 v0.60
          git fetch origin version-0601
          git worktree add ../v0601 origin/version-0601
          for v in v0593 v060 v0601; do git -C ../$v log --oneline -1; done
      - name: Zeitleiste v0593 (6 Laeufe)
        continue-on-error: true
        run: |
          for r in 1 2 3 4 5 6; do
            timeout 600 python messung_060/zeitleiste_0601.py ../v0593 "$RUNNER_TEMP/z_0593_$r.json" > "$RUNNER_TEMP/z_0593_$r.txt" 2>&1 || echo "Rueckgabe $?"
            grep "^ERG" "$RUNNER_TEMP/z_0593_$r.txt" | while IFS= read -r z; do echo "::notice::$r $z"; done
          done
      - name: Zeitleiste v060 (6 Laeufe)
        continue-on-error: true
        run: |
          for r in 1 2 3 4 5 6; do
            timeout 600 python messung_060/zeitleiste_0601.py ../v060 "$RUNNER_TEMP/z_060_$r.json" > "$RUNNER_TEMP/z_060_$r.txt" 2>&1 || echo "Rueckgabe $?"
            grep "^ERG" "$RUNNER_TEMP/z_060_$r.txt" | while IFS= read -r z; do echo "::notice::$r $z"; done
          done
      - name: Zeitleiste v0601 (6 Laeufe)
        continue-on-error: true
        run: |
          for r in 1 2 3 4 5 6; do
            timeout 600 python messung_060/zeitleiste_0601.py ../v0601 "$RUNNER_TEMP/z_0601_$r.json" > "$RUNNER_TEMP/z_0601_$r.txt" 2>&1 || echo "Rueckgabe $?"
            grep "^ERG" "$RUNNER_TEMP/z_0601_$r.txt" | while IFS= read -r z; do echo "::notice::$r $z"; done
          done
      - name: Zeitleiste Zusammenfassung
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/messung_060/zeitleiste_tab.py" z_*.json > ztab.txt; cat ztab.txt
          head -10 ztab.txt | while IFS= read -r z; do echo "::notice::$z"; done
      - name: Darstellungswechsel (3 Runden je 6 Wechsel, alle Bereiche zu)
        continue-on-error: true
        run: |
          for r in 1 2 3; do
            for v in 0593 060 0601; do
              echo "=== v$v Runde $r"
              MESS_FARBEN_OFFEN=0 MESS_WECHSEL=6 timeout 900 python messung_060/messung_wechsel.py ../v$v "$RUNNER_TEMP/m_${v}_$r.json" > "$RUNNER_TEMP/m_${v}_$r.txt" 2>&1 || echo "Rueckgabe $?"
            done
          done
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import glob, json, os, statistics as st
          for k in ("0593", "060", "0601"):
              g, el = [], []
              for f in sorted(glob.glob("m_%s_*.json" % k)):
                  d = json.load(open(f, encoding="utf-8"))
                  g += [x["gesamt_ms"] for x in d["wechsel"]]
                  el.append(d["wechsel"][0]["elemente_vorher"])
              if g:
                  print("::notice::WECHSEL v%s n=%d Median %d ms (%d-%d) Elemente vorher %s"
                        % (k, len(g), round(st.median(g)), min(g), max(g), el))
              else:
                  print("::notice::WECHSEL v%s keine Werte" % k)
          PY
