# ============================================================================
#  Screenreader-Prototyp als Windows-Programm bauen (Plan 0.59, Abschnitt 8a)
# ============================================================================
#  Liegt NUR auf dem Zweig proto-screenreader und laeuft nur bei Pushes dorthin.
#  Ergebnis ist ein ZIP unter "Artifacts" auf der Seite des Laufs - kein Tag,
#  kein Release, kein Einfluss auf das Programm oder die Update-Funktion.
# ============================================================================

name: Screenreader-Prototyp bauen

on:
  push:
    branches: [proto-screenreader]

# Neuer Push ersetzt einen noch laufenden Bau
concurrency:
  group: prototyp-screenreader
  cancel-in-progress: true

jobs:
  windows:
    name: Prototyp (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Flet installieren
        run: python -m pip install "flet[all]==1.0.1" certifi

      - name: Bauordner vorbereiten
        run: python prototyp_screenreader/bauordner.py

      - name: Windows-Programm bauen
        working-directory: prototyp_screenreader/bau
        run: flet build windows --yes --no-rich-output --skip-flutter-doctor

      - name: ZIP packen
        shell: pwsh
        run: |
          $out = "prototyp_screenreader/bau/build/windows"
          Get-ChildItem $out
          New-Item -ItemType Directory -Force "FISI-Screenreader-Prototyp" | Out-Null
          Copy-Item "$out/*" "FISI-Screenreader-Prototyp" -Recurse
          foreach ($f in "NVDA-Testanleitung.md", "NVDA-Testanleitung.pdf") { if (Test-Path "prototyp_screenreader/$f") { Copy-Item "prototyp_screenreader/$f" "FISI-Screenreader-Prototyp/" } }
          Compress-Archive -Path "FISI-Screenreader-Prototyp" -DestinationPath "FISI-Screenreader-Prototyp-Windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: FISI-Screenreader-Prototyp-Windows
          path: FISI-Screenreader-Prototyp-Windows.zip
          if-no-files-found: error

      # Messung unter Windows: UI-Automation-Baum (das, was NVDA abfragt).
      # Ersetzt keinen NVDA-Test, zeigt aber Namen, Rollen und Zustaende.
      - name: UIA-Messung Prototyp
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "prototyp_screenreader/bau/build/windows/*.exe")[0].FullName
          $p = Start-Process $exe -PassThru
          New-Item -ItemType Directory -Force uia | Out-Null
          powershell -NoProfile -File prototyp_screenreader/messung/uia_baum.ps1 -Fenster "FISI Screenreader-Prototyp" -Klick "Farben, eingeklappt" | Tee-Object uia/uia_prototyp.txt
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: UIA-Messung CustomTkinter (Bausteine und echtes PC-Programm)
        continue-on-error: true
        shell: pwsh
        env:
          FISI_DB_PATH: ${{ runner.temp }}\fisi_mess\fisi_lernplattform.db
        run: |
          python -m pip install -r requirements.txt
          New-Item -ItemType Directory -Force uia, "$env:RUNNER_TEMP\fisi_mess" | Out-Null
          $t = Start-Process python -ArgumentList "prototyp_screenreader/messung/tk_test.py", "60000" -PassThru
          powershell -NoProfile -File prototyp_screenreader/messung/uia_baum.ps1 -Fenster "FISI Tk-Test" | Tee-Object uia/uia_customtkinter_bausteine.txt
          Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
          $a = Start-Process python -ArgumentList "start.py" -PassThru
          $titel = python -c "import build; print('FISI Lernplattform ' + build.app_version())"
          powershell -NoProfile -File prototyp_screenreader/messung/uia_baum.ps1 -Fenster $titel -Warten 90 | Tee-Object uia/uia_pc_programm.txt
          Stop-Process -Id $a.Id -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uia-messung
          path: uia/*
