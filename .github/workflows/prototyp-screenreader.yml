# ============================================================================
#  Screenreader-Prototyp als Windows-Programm bauen (Plan 0.59, Abschnitt 8a)
# ============================================================================
#  Liegt NUR auf dem Zweig proto-screenreader und laeuft nur bei Pushes dorthin.
#  Ergebnis ist ein ZIP unter "Artifacts" auf der Seite des Laufs - kein Tag,
#  kein Release, kein Einfluss auf das Programm oder die Update-Funktion.
# ============================================================================

name: Screenreader-Prototyp bauen

on:
  push:
    branches: [proto-screenreader]

# Neuer Push ersetzt einen noch laufenden Bau
concurrency:
  group: prototyp-screenreader
  cancel-in-progress: true

jobs:
  windows:
    name: Prototyp (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Flet installieren
        run: python -m pip install "flet[all]==1.0.1" certifi

      - name: Bauordner vorbereiten
        run: python prototyp_screenreader/bauordner.py

      - name: Windows-Programm bauen
        working-directory: prototyp_screenreader/bau
        run: flet build windows --yes --no-rich-output --skip-flutter-doctor

      - name: ZIP packen
        shell: pwsh
        run: |
          $out = "prototyp_screenreader/bau/build/windows"
          Get-ChildItem $out
          New-Item -ItemType Directory -Force "FISI-Screenreader-Prototyp" | Out-Null
          Copy-Item "$out/*" "FISI-Screenreader-Prototyp" -Recurse
          foreach ($f in "NVDA-Testanleitung.md", "NVDA-Testanleitung.pdf") { if (Test-Path "prototyp_screenreader/$f") { Copy-Item "prototyp_screenreader/$f" "FISI-Screenreader-Prototyp/" } }
          Compress-Archive -Path "FISI-Screenreader-Prototyp" -DestinationPath "FISI-Screenreader-Prototyp-Windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: FISI-Screenreader-Prototyp-Windows
          path: FISI-Screenreader-Prototyp-Windows.zip
          if-no-files-found: error

      # Messung unter Windows: UI-Automation-Baum (das, was NVDA abfragt).
      # Ersetzt keinen NVDA-Test, zeigt aber Namen, Rollen und Zustaende.
      # Erledigt (Ergebnisse in prototyp_screenreader/messung/ergebnisse und im
      # Bericht); zum Wiederholen "if: false" entfernen
      - name: UIA-Messung Prototyp
        if: false
        continue-on-error: true
        shell: pwsh
        run: |
          # Wie NVDA: Windows mitteilen, dass ein Screenreader laeuft
          # (SPI_SETSCREENREADER). Flutter baut seinen Zugaenglichkeitsbaum
          # sonst nicht auf.
          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint a, uint b, System.IntPtr c, uint d);'
          [W.U]::SystemParametersInfo(0x0047, 1, [System.IntPtr]::Zero, 0x2)
          $exe = (Get-ChildItem "prototyp_screenreader/bau/build/windows/*.exe")[0].FullName
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          New-Item -ItemType Directory -Force uia | Out-Null
          powershell -NoProfile -File prototyp_screenreader/messung/uia_baum.ps1 -Fenster "FISI Screenreader-Prototyp" -Klick "Farben, eingeklappt" | Tee-Object uia/uia_prototyp.txt
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: UIA-Messung CustomTkinter (Bausteine und echtes PC-Programm)
        if: false
        continue-on-error: true
        shell: pwsh
        env:
          FISI_DB_PATH: ${{ runner.temp }}\fisi_mess\fisi_lernplattform.db
        run: |
          python -m pip install -r requirements.txt
          New-Item -ItemType Directory -Force uia, "$env:RUNNER_TEMP\fisi_mess" | Out-Null
          $t = Start-Process python -ArgumentList "prototyp_screenreader/messung/tk_test.py", "60000" -PassThru
          powershell -NoProfile -File prototyp_screenreader/messung/uia_baum.ps1 -Fenster "FISI Tk-Test" | Tee-Object uia/uia_customtkinter_bausteine.txt
          Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
          $a = Start-Process python -ArgumentList "start.py" -PassThru
          $titel = python -c "import build; print('FISI Lernplattform ' + build.app_version())"
          powershell -NoProfile -File prototyp_screenreader/messung/uia_baum.ps1 -Fenster $titel -Warten 90 | Tee-Object uia/uia_pc_programm.txt
          Stop-Process -Id $a.Id -Force -ErrorAction SilentlyContinue

      # Erkundung: NVDA automatisch pruefen (Auftrag 06.10.2026).
      # Gegenprobe: reines Flutter-Programm (Zaehler-Vorlage) mit derselben
      # Flutter-Version, die "flet build" eben heruntergeladen hat
      - name: Gegenprobe reines Flutter-Programm bauen
        continue-on-error: true
        shell: pwsh
        run: |
          $fl = Get-ChildItem $env:USERPROFILE -Filter flutter.bat -Recurse -Depth 6 -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "bin" } | Select-Object -First 1
          if (-not $fl) { Write-Output "flutter.bat nicht gefunden"; exit 0 }
          Write-Output "Flutter: $($fl.FullName)"
          & $fl.FullName --version
          Set-Location $env:RUNNER_TEMP
          & $fl.FullName create --project-name gegenprobe --platforms windows gegenprobe_flutter
          Set-Location gegenprobe_flutter
          & $fl.FullName build windows --release
          Get-ChildItem build/windows/x64/runner/Release

      # Lauf 8 zeigte im gebauten Programm "Error running app": Prototyp
      # einmal direkt mit Python starten, um die Fehlermeldung zu sehen
      - name: Prototyp aus dem Quelltext starten (Fehlersuche)
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList "prototyp_screenreader/optionen_flet.py" -RedirectStandardOutput "$env:RUNNER_TEMP\q_out.txt" -RedirectStandardError "$env:RUNNER_TEMP\q_err.txt" -PassThru
          Start-Sleep -Seconds 45
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process | Where-Object { $_.ProcessName -like "flet*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Output "== Ausgabe"; Get-Content "$env:RUNNER_TEMP\q_out.txt" -ErrorAction SilentlyContinue
          Write-Output "== Fehlerausgabe"; Get-Content "$env:RUNNER_TEMP\q_err.txt" -ErrorAction SilentlyContinue
          $fd = Join-Path $env:TEMP "fisi_prototyp_fehler.txt"
          if (Test-Path $fd) { Write-Output "== Fehlerdatei"; Get-Content $fd; Remove-Item $fd }

      - name: NVDA-Messung (Sprachausgabe als Text mitschreiben)
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "prototyp_screenreader/bau/build/windows/*.exe")[0].FullName
          $geg = Join-Path $env:RUNNER_TEMP "gegenprobe_flutter/build/windows/x64/runner/Release/gegenprobe.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File prototyp_screenreader/messung/nvda/nvda_lauf.ps1 -Prototyp $exe -Gegenprobe $geg -Aus nvda_messung

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nvda-messung
          path: nvda_messung/*
          if-no-files-found: ignore
