# ============================================================================
#  FISI Lernplattform - Installer fuer Windows, Linux und macOS bauen
# ============================================================================
#  PyInstaller kann nur fuer das System bauen, auf dem es laeuft. Deshalb
#  fuehrt GitHub hier build.py auf je einem Windows-, Linux- und macOS-Rechner
#  aus und sammelt die fertigen Installer ein. Dazu kommt die Handy-App
#  (Android-APK, mit Flet gebaut, siehe mobile/).
#
#  Start:
#    - automatisch beim Push eines Versions-Tags, z.B.:
#          git tag v0.22
#          git push origin v0.22
#      Dann entsteht zusaetzlich ein GitHub-Release mit allen Installern.
#    - von Hand im Reiter "Actions" -> "Installer bauen" -> "Run workflow".
#      Die Installer liegen dann unten auf der Seite des Laufs unter
#      "Artifacts" zum Herunterladen bereit.
# ============================================================================

name: Installer bauen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          # Aelteres Ubuntu = aeltere glibc = laeuft auf mehr Linux-Systemen
          - os: ubuntu-22.04
            label: linux
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-intel

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Version pruefen (Tag muss zu APP_VERSION passen)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(python -c "import build; print(build.app_version())")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu APP_VERSION $VERSION in app_gui.py"
            exit 1
          fi
          # Ohne Abschnitt in AENDERUNGEN.md gibt es keinen Release-Text
          python build.py --versionshinweise > /dev/null

      - name: Linux-Werkzeuge installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk-dev xvfb
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Inno Setup bereitstellen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Abhaengigkeiten installieren
        run: python -m pip install -r requirements-build.txt

      - name: Anwendung und Installer bauen
        run: python build.py

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.label }}
          path: installer_output/*
          if-no-files-found: error

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Version pruefen (Tag muss zu APP_VERSION passen)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import build; print(build.app_version())")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu APP_VERSION $VERSION in app_gui.py"
            exit 1
          fi
          python -c "import build; build.check_versions('$VERSION')"

      - name: Flet installieren
        run: python -m pip install "flet[all]==1.0.1" certifi

      - name: Gemeinsame Dateien kopieren und Selbsttest
        run: |
          python mobile/vorbereiten.py
          FISI_DB_PATH="$RUNNER_TEMP/selbsttest.db" python mobile/src/main.py --selbsttest

      - name: Signaturschluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 fehlt - ohne festen Schluessel lassen"
            echo "sich spaetere Versionen nicht als Update installieren."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fisi-upload.jks"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/fisi-upload.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: mobile
        env:
          FLET_ANDROID_SIGNING_KEY_ALIAS: upload
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flet build apk --yes --no-rich-output --skip-flutter-doctor

      - name: APK umbenennen
        run: |
          VERSION=$(python -c "import build; print(build.app_version())")
          mkdir -p installer_output
          APK=$(ls mobile/build/apk/*.apk | head -n 1)
          cp "$APK" "installer_output/FISI-Lernplattform-${VERSION}-Android.apk"
          ls -l installer_output

      - uses: actions/upload-artifact@v7
        with:
          name: installer-android
          path: installer_output/*
          if-no-files-found: error

  release:
    name: GitHub-Release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Versionshinweise aus AENDERUNGEN.md
        run: python3 build.py --versionshinweise > versionshinweise.md

      - uses: actions/download-artifact@v8
        with:
          path: installer
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          name: FISI Lernplattform ${{ github.ref_name }}
          body_path: versionshinweise.md
          files: installer/*
