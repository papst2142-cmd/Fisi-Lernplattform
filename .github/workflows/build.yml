# ============================================================================
#  Fachinformatiker Lernplattform - Installer fuer Windows, Linux und macOS bauen
# ============================================================================
#  PyInstaller kann nur fuer das System bauen, auf dem es laeuft. Deshalb
#  fuehrt GitHub hier build.py auf je einem Windows-, Linux- und macOS-Rechner
#  aus und sammelt die fertigen Installer ein. Dazu kommt die Handy-App
#  (Android-APK, mit Flet gebaut, siehe mobile/).
#
#  Start:
#    - automatisch beim Push eines Versions-Tags, z.B.:
#          git tag v0.22
#          git push origin v0.22
#      Dann entsteht zusaetzlich ein GitHub-Release mit allen Installern.
#    - automatisch ueber "Release automatisch" (release.yml), sobald auf
#      main eine neue Version steht (python build.py --setze-version ...).
#      Der Tag wird dort angelegt und dieser Ablauf aufgerufen.
#    - von Hand im Reiter "Actions" -> "Installer bauen" -> "Run workflow".
#      Die Installer liegen dann unten auf der Seite des Laufs unter
#      "Artifacts" zum Herunterladen bereit.
#      Mit einem Namen im Feld "vorab" (z.B. 0.56-test1) entsteht zusaetzlich
#      eine Testversion als Vorab-Release (Pre-release) mit der Windows-.exe
#      als Datei. Ein Pre-release liefert GitHub nie als "latest" aus, die
#      Update-Funktion bietet es deshalb niemandem an.
#
#  Nachholen, wenn ein Release-Lauf nach dem Anlegen des Tags scheitert:
#  zuerst im roten Lauf "Re-run failed jobs". Geht das nicht, im Reiter
#  "Actions" -> "Installer bauen" -> "Run workflow" bei "Use workflow from"
#  den Tag (z.B. v0.63.2) waehlen. Dann wird fuer diesen Tag gebaut und
#  veroeffentlicht. Ab 0.63.2 holt "Release automatisch" (release.yml) das
#  beim naechsten Push auf main auch selbst nach: Es prueft, ob es das
#  Release gibt, nicht nur den Tag.
#
#  Ab 0.56 laeuft vor jedem Release (und vor jeder Testversion) der
#  automatische Update-Test (Job "update-test"): letzte normale Version aus
#  dem Release installieren, neue Version als Update einspielen, pruefen.
# ============================================================================

name: Installer bauen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      vorab:
        description: "Testversion als Vorab-Release anlegen (Name, z.B. 0.56-test1) - leer = nur bauen"
        type: string
        required: false
        default: ""
      vorab_dateien:
        description: "Dateien der Testversion: windows = nur die .exe (wie bisher), linux-handy = nur .deb und Android-APK (ab 0.59.1)"
        type: choice
        options: [windows, linux-handy]
        default: windows
      vorab_zweck:
        description: "Eine Zeile fuer den Text der Testversion: was damit getestet wird (optional)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: "Versions-Tag, fuer den gebaut und veroeffentlicht wird (z.B. v0.28)"
        type: string
        required: true
    # Ab 0.63.2 (B-M-07): release.yml gibt nur diese zwei Secrets weiter
    # (statt "secrets: inherit"). Fehlt eines, meldet es der Job "android".
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

# Tag des Laufs: beim Aufruf aus release.yml uebergeben, sonst der gepushte Tag
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IS_RELEASE: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}

# Ab 0.63.2 (B-M-07): Token nur mit Leserecht; Schreibrecht haben nur die
# Jobs "vorab" und "release" (dort eigenes "permissions")
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Ab 0.63.2 (B-M-06): nur der Linux-Bau laeuft im Container (sonst leer)
    container: ${{ matrix.container }}
    # Ab 0.63.2 (B-M-03): Zeitgrenze (laengster Lauf bisher unter 10 min)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows
          # Aelteres Ubuntu = aeltere glibc = laeuft auf mehr Linux-Systemen.
          # Ab 0.63.2 (B-M-06, F29): gebaut wird in einem Container Ubuntu
          # 22.04 (glibc 2.35) auf einem aktuellen Runner - unabhaengig davon,
          # wann GitHub das Runner-Bild ubuntu-22.04 abschaltet. Das Bild ist
          # per Pruefsumme festgelegt (N11-F5, Stand 04.10.2026), damit sich
          # glibc und Tk nicht still aendern. Die Schritt-Pruefung "glibc-
          # Bedarf" haelt den Bedarf auf dem Stand von v0.63.1.
          - os: ubuntu-24.04
            label: linux
            container: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
          # Ab 0.62.4: macos-15 statt macos-14 (GitHub schaltet macos-14 am
          # 02.11.2026 ab). Weiter Apple Silicon (arm64), Label bleibt.
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-intel

    steps:
      # Ab 0.63.2 (B-M-06): Der Container Ubuntu 22.04 bringt fast nichts mit
      # (kein sudo, kein git, keine Bibliotheken fuer Python und Tk). Alles
      # aus den signierten Ubuntu-Quellen, vor checkout und setup-python.
      - name: Linux-Werkzeuge installieren
        if: runner.os == 'Linux'
        # Ab 0.63.2 (B-M-03): normal unter 1 min, ein Haenger lief 41 min
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: Etc/UTC
        # Ab 0.63.2 (B-M-02): Netzfehler werden innerhalb des Schritts
        # wiederholt (apt je bis zu 5x), nie der ganze Job
        run: |
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends tk-dev xvfb xauth \
            binutils file curl ca-certificates git lsb-release squashfs-tools \
            libssl3 libffi8 libsqlite3-0 libbz2-1.0 liblzma5 zlib1g libncursesw6 libreadline8 \
            libuuid1 libgdbm6 libexpat1 xz-utils zstd
          cat /etc/os-release | head -n 2
          ldd --version | head -n 1
          dpkg-query -W -f='${Package} ${Version}\n' tk8.6-dev libtk8.6 libc6
          # pip nimmt keinen Zwischenspeicher in einem Ordner, der nicht dem
          # Benutzer gehoert (/github/home gehoert dem Runner, hier root;
          # Lauf 38505081061: "cache is disabled") - eigener Ordner
          mkdir -p /root/.cache/pip
          echo "PIP_CACHE_DIR=/root/.cache/pip" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Ab 0.63.2 (B-M-08): pip-Zwischenspeicher nur in normalen Laeufen,
          # Release-Laeufe bauen ohne Cache (nachvollziehbar)
          cache: ${{ env.IS_RELEASE != 'true' && !inputs.vorab && 'pip' || '' }}
          cache-dependency-path: requirements-lock-bau.txt
        # Ab 0.63.2 (B-M-06): im Container NICHT das Python des Runners
        # (eingehaengt unter /__t, gebaut fuer Ubuntu 24.04), sondern das fuer
        # Ubuntu 22.04 gebaute aus dem Python-Verzeichnis von GitHub laden.
        # Eigener Ordner: /opt/hostedtoolcache uebersetzt der Runner wieder
        # auf /__t (Lauf 38504675476)
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.os == 'Linux' && '/opt/werkzeuge-jammy' || '' }}

      - name: Version pruefen (Tag muss zu APP_VERSION passen)
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          VERSION=$(python -c "import build; print(build.app_version())")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG passt nicht zu APP_VERSION $VERSION in app_gui.py"
            exit 1
          fi
          # Ohne Abschnitt in AENDERUNGEN.md gibt es keinen Release-Text
          python build.py --versionshinweise > /dev/null

      - name: AppImage-Werkzeuge laden (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        # Ab 0.63.2 (B-M-02): Downloads je bis zu 5x im Schritt wiederholt
        run: |
          # Ab 0.62 (A5): feste Fassungen statt "continuous", mit SHA-256-
          # Pruefung - stimmt eine Pruefsumme nicht, bricht der Bau ab.
          # appimagetool 1.9.1 und die AppImage-Laufzeit type2-runtime
          # 20251108 (ihre Lizenzen stehen in THIRD_PARTY_NOTICES.txt).
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 300 -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 300 -o runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          printf '%s\n' \
            "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" \
            "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64" \
            | sha256sum --check --strict
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$PWD/runtime-x86_64" >> "$GITHUB_ENV"

      - name: Inno Setup bereitstellen
        if: runner.os == 'Windows'
        shell: pwsh
        # Ab 0.63.2 (B-M-02): bei Netzfehler bis zu 3 Versuche im Schritt.
        # Ab 0.63.2 (B-M-05): feste Fassung 6.7.1 (im Referenzlauf 38443624150
        # vorinstalliert, Runner-Bild windows-2025 20260925). Ist eine andere
        # oder keine da, wird genau diese installiert; sonst bricht der Bau ab.
        run: |
          $soll = "6.7.99"   # NUR PROBE N11 (Frage 21): Fassung, die es nicht gibt
          # Fassung aus dem Uninstall-Eintrag (ISCC.exe selbst traegt keine
          # Produktfassung, gemessen: 0.0.0.0)
          $schluessel = @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1",
                          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1")
          function Fassung {
            foreach ($s in $schluessel) { if (Test-Path $s) { return (Get-ItemProperty $s).DisplayVersion } }
            return "fehlt"
          }
          $ist = Fassung
          Write-Host "Inno Setup vorhanden: $ist"
          if ($ist -ne $soll) {
            foreach ($versuch in 1..3) {
              choco install innosetup --version $soll -y --no-progress --allow-downgrade
              if ($LASTEXITCODE -eq 0) { break }
              if ($versuch -eq 3) { exit 1 }
              Write-Host "Wiederholung wegen Netzfehler (choco, Versuch $versuch)"
              Start-Sleep -Seconds 10
            }
            $ist = Fassung
          }
          if ($ist -ne $soll) { Write-Host "Inno Setup $ist statt $soll"; exit 1 }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { Write-Host "ISCC.exe fehlt"; exit 1 }
          Write-Host "Inno Setup $ist (fest)"

      # Ab 0.63.2 (B-M-05): nur aus der Lock-Datei, jedes Paket mit Pruefsumme
      - name: Abhaengigkeiten installieren
        run: python -m pip install --retries 10 --timeout 60 --require-hashes -r requirements-lock-bau.txt

      # Ab 0.63.2 (B-N-12, F26 (b)): bekannte Sicherheitsluecken in allen
      # Lock-Dateien (PC und Handy). Normaler Lauf und Testversion: Warnung;
      # Release-Lauf: Fund oder "nicht pruefbar" (nach 3 Versuchen) = rot,
      # dann kein Release. pip-audit selbst fest mit Pruefsummen, in einer
      # eigenen Umgebung. Prueft nur Python-Pakete von PyPI.
      - name: Sicherheitsluecken pruefen (pip-audit)
        if: runner.os == 'Linux'
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install --retries 10 --timeout 60 --quiet --require-hashes -r requirements-lock-pip-audit.txt
          python pruefung/pip_audit_lauf.py --pip-audit "$RUNNER_TEMP/audit/bin/pip-audit" \
            requirements-lock-bau.txt requirements-lock-tests.txt requirements-lock-flet.txt \
            requirements-lock-certifi.txt requirements-lock-pip-audit.txt

      # NUR PROBE N11 (Frage 19): Pillow universal2 aus den beiden offiziellen
      # Raedern (Pruefsummen aus requirements-lock-bau.txt) mit delocate-merge
      - name: "PROBE: Pillow universal2 aus den offiziellen Raedern"
        if: matrix.label == 'macos-arm64'
        run: |
          set -x
          F="$RUNNER_TEMP/fuse"; rm -rf "$F"; mkdir -p "$F/arm" "$F/x86" "$F/out"
          echo "pillow==12.3.0 --hash=sha256:ffd0c5368496f41b0944be820fcb7a838aa6e623d250b01acf2643939c3f99d7" > "$F/arm.txt"
          echo "pillow==12.3.0 --hash=sha256:ba09209fbe443b4acccebe845d8a138b89a8f4fbaeedd44953490b5315d5e965" > "$F/x86.txt"
          python -m pip download --retries 10 --timeout 60 --no-deps --only-binary=:all: --platform macosx_11_0_arm64 --python-version 3.12 --implementation cp --abi cp312 --require-hashes -r "$F/arm.txt" -d "$F/arm"
          python -m pip download --retries 10 --timeout 60 --no-deps --only-binary=:all: --platform macosx_10_13_x86_64 --python-version 3.12 --implementation cp --abi cp312 --require-hashes -r "$F/x86.txt" -d "$F/x86"
          shasum -a 256 "$F"/arm/*.whl "$F"/x86/*.whl
          python -m venv "$RUNNER_TEMP/delocate"
          "$RUNNER_TEMP/delocate/bin/python" -m pip install --retries 10 --timeout 60 --require-hashes -r pruefung/probe_delocate.txt
          "$RUNNER_TEMP/delocate/bin/delocate-merge" --help | head -n 5
          "$RUNNER_TEMP/delocate/bin/delocate-merge" "$F"/arm/*.whl "$F"/x86/*.whl -w "$F/out"
          ls -l "$F/out"
          shasum -a 256 "$F"/out/*.whl
          python -m pip install --no-deps --force-reinstall "$F"/out/*.whl
          PIL=$(python -c "import os, PIL; print(os.path.dirname(PIL.__file__))")
          n=0; fehler=0
          for f in $(find "$PIL" -type f \( -name "*.so" -o -name "*.dylib" \)); do
            n=$((n+1)); a=$(lipo -archs "$f")
            if [ "$(printf '%s\n' $a | sort | tr '\n' ' ')" != "arm64 x86_64 " ]; then echo "NICHT universal: $f ($a)"; fehler=1; fi
          done
          echo "Pillow: $n Binaerdateien, fehlerhaft: $fehler"
          python -c "import PIL, PIL.Image, PIL._imaging; print('Pillow', PIL.__version__, 'laedt')"
          exit $fehler

      # Ab 0.61 (M1): Namens-Waechter auch auf echtem macOS (Datenordner-Weg).
      # Unter macOS laeuft sonst keine Testsammlung.
      - name: Namens-Waechter (macOS)
        if: runner.os == 'macOS'
        run: python test_namen.py

      # Unter macOS prueft build.py ab 0.61 zusaetzlich die Info.plist (M3)
      # und startet die App ein zweites Mal mit echtem Datenordner (M2)
      - name: Anwendung und Installer bauen
        run: python build.py

      # Ab 0.62 (T3): Gegenprobe der Lizenz-Zuordnung auf jedem System - einer
      # echten Datei wird die Zuordnung weggenommen, die Pruefung muss sie melden
      - name: Gegenprobe Lizenz-Zuordnung
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then APP=dist/FISI-Lernplattform.app; else APP=dist/FISI-Lernplattform; fi
          python lizenzen.py "$APP" --gegenprobe

      # Ab 0.62.1 (Teil D): Unter Linux nennt die Hinweisdatei das Ubuntu-Paket
      # mit inhaltsgleicher Datei (zlib1g, nicht lib32z1); kein 32-Bit-Paket und
      # keine Luecke "nicht eindeutig" (lizenzen.py meldet sie statt zu raten)
      - name: Hinweisdatei ohne lib32 und ohne unklare Pakete (Linux)
        if: runner.os == 'Linux'
        run: |
          NOTICES=dist/FISI-Lernplattform/THIRD_PARTY_NOTICES.txt
          grep -n "^#### " "$NOTICES" | grep -i -e "lib32" -e "nicht eindeutig" && exit 1
          grep -c "^#### zlib1g (Ubuntu-Paket)" "$NOTICES"

      # Ab 0.63.2 (B-M-06): glibc-Bedarf nicht hoeher als bei v0.63.1
      # (Programmordner, .deb und AppImage, jede ELF-Datei)
      - name: glibc-Bedarf pruefen (Linux)
        if: runner.os == 'Linux'
        run: python pruefung/glibc_pruefen.py dist/FISI-Lernplattform installer_output/*.deb installer_output/*.AppImage

      # Ab 0.63.2 (B-H-12): Pakete ohne .DS_Store; Startdatei und Hinweisdatei
      # je Paketart (AppImage mit Version und AppImage-Laufzeit, .deb ohne)
      - name: Paketinhalt pruefen (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(python -c "import build; print(build.app_version())")
          rm -rf "$RUNNER_TEMP/deb" "$RUNNER_TEMP/appimage"
          dpkg-deb -x installer_output/*.deb "$RUNNER_TEMP/deb"
          OFFSET=$(python -c "import sys; sys.path.insert(0, 'pruefung'); import glibc_pruefen as g; print(g._elf_end(open(sys.argv[1], 'rb').read()))" installer_output/*.AppImage)
          unsquashfs -q -no-progress -o "$OFFSET" -d "$RUNNER_TEMP/appimage" installer_output/*.AppImage > /dev/null
          FEHLER=0
          if find dist "$RUNNER_TEMP/deb" "$RUNNER_TEMP/appimage" -name .DS_Store | grep .; then echo "FEHLER: .DS_Store im Paket"; FEHLER=1; fi
          DEB_DESKTOP="$RUNNER_TEMP/deb/usr/share/applications/fisi-lernplattform.desktop"
          APP_DESKTOP="$RUNNER_TEMP/appimage/fisi-lernplattform.desktop"
          # desktop-file-validate laeuft nicht hier: die Fassung von Ubuntu
          # 22.04 (0.26) kennt SingleMainWindow (Spezifikation 1.5) nicht und
          # meldet es als Fehler (Lauf 38505311173). Geprueft wird mit 0.27 im
          # Job tests (test_bau_0632_n11.py, gleiche Funktionen des Paketbaus).
          grep -qx "X-AppImage-Version=$VERSION" "$APP_DESKTOP" || { echo "FEHLER: AppImage ohne X-AppImage-Version=$VERSION"; FEHLER=1; }
          if grep -q "X-AppImage-Version" "$DEB_DESKTOP"; then echo "FEHLER: .deb mit X-AppImage-Version"; FEHLER=1; fi
          for f in "$RUNNER_TEMP/deb/opt/fisi-lernplattform/THIRD_PARTY_NOTICES.txt" "$RUNNER_TEMP/deb/usr/share/doc/fisi-lernplattform/THIRD_PARTY_NOTICES.txt"; do
            if grep -q "^#### AppImage-Laufzeit" "$f"; then echo "FEHLER: AppImage-Laufzeit in $f"; FEHLER=1; fi
          done
          grep -c "^#### AppImage-Laufzeit" "$RUNNER_TEMP/appimage/usr/lib/fisi-lernplattform/THIRD_PARTY_NOTICES.txt" || { echo "FEHLER: AppImage ohne AppImage-Laufzeit in der Hinweisdatei"; FEHLER=1; }
          if [ "$FEHLER" = 0 ]; then echo "Paketinhalt geprueft: ohne .DS_Store, Startdatei und Hinweisdatei je Paketart richtig"; fi
          exit "$FEHLER"

      - name: "PROBE: jede Mach-O-Datei der App universal (lipo)"
        if: matrix.label == 'macos-arm64'
        run: |
          n=0; fehler=0
          while IFS= read -r f; do
            if file -b "$f" | grep -q "Mach-O"; then
              n=$((n+1)); a=$(lipo -archs "$f")
              if [ "$(printf '%s\n' $a | sort | tr '\n' ' ')" != "arm64 x86_64 " ]; then echo "NICHT universal: $f ($a)"; fehler=1; fi
            fi
          done < <(find dist/FISI-Lernplattform.app -type f)
          echo "App: $n Mach-O-Dateien, alle universal: $([ $fehler = 0 ] && echo ja || echo nein)"
          exit $fehler

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.label }}
          path: installer_output/*
          if-no-files-found: error

  # NUR PROBE N11 (Frage 19): dieselbe Universal-dmg auf dem Intel-Mac starten
  probe-universal-intel:
    name: "PROBE: Universal-App auf Intel"
    needs: build
    # auch wenn der Windows-Bau (Probe Frage 21) rot ist
    if: ${{ !cancelled() }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: installer-macos-arm64
          path: dmg
      - name: Starttests der Universal-App auf Intel
        run: |
          uname -m
          ls -l dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/vol" dmg/*-macOS-arm64.dmg
          cp -R "$RUNNER_TEMP/vol/FISI-Lernplattform.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/vol"
          APP="$RUNNER_TEMP/FISI-Lernplattform.app"
          lipo -archs "$APP/Contents/MacOS/FISI-Lernplattform"
          python -c "import sys, build; a = sys.argv[1]; build.check_macos_bundle(a, build.app_version()); build.smoke_test(a); build.smoke_test_data_dir(a)" "$APP"

  android:
    name: android
    runs-on: ubuntu-24.04
    # Ab 0.63.2 (B-M-03): Zeitgrenze (laengster Lauf bisher gut 10 min)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Ab 0.63.2 (B-M-08): pip-Zwischenspeicher nur in normalen Laeufen,
          # Release-Laeufe bauen ohne Cache (nachvollziehbar)
          cache: ${{ env.IS_RELEASE != 'true' && !inputs.vorab && 'pip' || '' }}
          cache-dependency-path: requirements-lock-flet.txt

      - name: Version pruefen (Tag muss zu APP_VERSION passen)
        if: env.IS_RELEASE == 'true'
        run: |
          VERSION=$(python -c "import build; print(build.app_version())")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG passt nicht zu APP_VERSION $VERSION in app_gui.py"
            exit 1
          fi
          python -c "import build; build.check_versions('$VERSION')"

      # Ab 0.63.2 (B-M-08): Flutter, Flet-Cache und Gradle-Zwischenspeicher
      # nur in normalen Laeufen wiederverwenden, Release-Laeufe und
      # Testversionen (Feld "vorab" gesetzt, N10-F3) bauen ohne Cache - wie
      # der pip-Cache in allen setup-python-Schritten. Die Laufzeit-Dateien
      # prueft der Schritt "Android-Laufzeit vorab laden und pruefen" auch
      # nach dem Wiederherstellen.
      - uses: actions/cache@v6
        if: env.IS_RELEASE != 'true' && !inputs.vorab
        with:
          path: |
            ~/flutter
            ~/.flet/cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-werkzeug-${{ runner.os }}-flet-1.0.1-${{ hashFiles('mobile/pyproject.toml') }}

      - name: Flet installieren
        # Ab 0.63.2 (B-M-05): flet[all]==1.0.1 samt Abhaengigkeiten und certifi
        # aus der Lock-Datei, jedes Paket mit Pruefsumme
        run: python -m pip install --retries 10 --timeout 60 --require-hashes -r requirements-lock-flet.txt

      # Ab 0.63.2 (B-H-09): ohne Bytecode-Dateien - sonst landen
      # mobile/src/__pycache__/*.cpython-312.pyc (gut 2 MB, auf dem Handy
      # unbenutzt) in der APK; "APK pruefen" verlangt das jetzt
      - name: Gemeinsame Dateien kopieren und Selbsttest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python mobile/vorbereiten.py
          FISI_DB_PATH="$RUNNER_TEMP/selbsttest.db" python mobile/src/main.py --selbsttest

      # Ab 0.63.2 (CI-a, B-E-07): Laufzeit-Dateien fuer den APK-Bau vorab
      # laden - mit Wiederholung im Schritt, Pruefung auf leere Datei, Datei
      # nur aus Nullbytes, gueltiges Archiv und feste SHA-256-Pruefsumme. Sie
      # liegen dort, wo flet und Gradle (serious_python_android 4.7.2) sie
      # suchen. Eine vorhandene Datei, die neuer ist als die auf dem Server,
      # laedt Gradle nicht noch einmal (onlyIfModified). Bisher luden sechs
      # Gradle-Aufgaben gleichzeitig; in mindestens 7 von etwa 110 Bauten brach
      # der Bau mit einer Datei aus Nullbytes ab.
      # Feste Fassungen: flet 1.0.1, python-build 20260921 (Python 3.14.7),
      # dart-bridge 1.10.0. Neue Flet-Fassung -> Liste und Pruefsummen neu.
      - name: Android-Laufzeit vorab laden und pruefen
        run: |
          CACHE="$HOME/.flet/cache"
          echo "FLET_CACHE_DIR=$CACHE" >> "$GITHUB_ENV"
          PB=https://github.com/flet-dev/python-build/releases/download/20260921
          DB=https://github.com/flet-dev/dart-bridge/releases/download/v1.10.0
          FL=https://github.com/flet-dev/flet/releases/download/v1.0.1
          # Prueft eine Datei; Grund steht danach in GRUND
          pruefe() {
            GRUND=""
            if [ ! -e "$1" ]; then GRUND="fehlt"; return 1; fi
            if [ ! -s "$1" ]; then GRUND="leer (0 Bytes)"; return 1; fi
            if [ "$(tr -d '\000' < "$1" | wc -c)" -eq 0 ]; then GRUND="nur Nullbytes"; return 1; fi
            case "$1" in
              *.tar.gz|*.tar.gz.tmp)
                if ! tar -tzf "$1" > /dev/null 2>&1; then GRUND="kein gueltiges Archiv"; return 1; fi ;;
              *.zip|*.zip.tmp)
                if ! python3 -c "import sys, zipfile; sys.exit(zipfile.ZipFile(sys.argv[1]).testzip() is not None)" "$1" 2> /dev/null; then
                  GRUND="kein gueltiges Archiv"; return 1
                fi ;;
            esac
            if [ "$(sha256sum "$1" | cut -d' ' -f1)" != "$2" ]; then GRUND="Pruefsumme falsch"; return 1; fi
            return 0
          }
          : > "$RUNNER_TEMP/laufzeit_liste.txt"
          : > "$RUNNER_TEMP/laufzeit_vorher.txt"
          while read -r SUMME DATEI URL; do
            ZIEL="$CACHE/$DATEI"
            mkdir -p "$(dirname "$ZIEL")"
            if pruefe "$ZIEL" "$SUMME"; then
              echo "vorhanden und geprueft: $DATEI"
            else
              if [ "$GRUND" != "fehlt" ]; then
                echo "Datei im Cache unbrauchbar ($GRUND), wird neu geladen: $DATEI"
              fi
              rm -f "$ZIEL"
              for VERSUCH in 1 2 3; do
                curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 300 -o "$ZIEL.tmp" "$URL" || true
                if pruefe "$ZIEL.tmp" "$SUMME"; then
                  mv "$ZIEL.tmp" "$ZIEL"
                  echo "geladen und geprueft: $DATEI"
                  break
                fi
                rm -f "$ZIEL.tmp"
                if [ "$VERSUCH" = 3 ]; then
                  echo "FEHLER: $DATEI nach 3 Versuchen unbrauchbar ($GRUND)"
                  exit 1
                fi
                echo "Wiederholung wegen Download-Fehler ($GRUND): $DATEI"
                sleep 10
              done
            fi
            # neuer als die Datei auf dem Server -> Gradle laedt nicht nach
            touch "$ZIEL"
            echo "$SUMME $DATEI" >> "$RUNNER_TEMP/laufzeit_liste.txt"
            echo "$(stat -c '%i %Y %s' "$ZIEL") $DATEI" >> "$RUNNER_TEMP/laufzeit_vorher.txt"
          done <<LISTE
          a60e8905a4844c7f3329178daabb54fa1966bc6ab3d81b318266fa6bf83e43d9 python-build/v3.14.7/python-android-dart-3.14.7-arm64-v8a.tar.gz $PB/python-android-dart-3.14.7-arm64-v8a.tar.gz
          8d41be58a14c81015c5f39fea0030152e7cc9e9a266133a891ddfcaab57389a2 python-build/v3.14.7/python-android-dart-3.14.7-x86_64.tar.gz $PB/python-android-dart-3.14.7-x86_64.tar.gz
          d7d9e27b359bd83625adde7121ae7efc8e1d13a220735078b29e387093756216 python-build/v3.14.7/python-android-dart-3.14.7-armeabi-v7a.tar.gz $PB/python-android-dart-3.14.7-armeabi-v7a.tar.gz
          34df57631381d163e722c22e93210f22b4056f119609d0009c86a3d8f5d8ed64 dart-bridge/v1.10.0/libdart_bridge-android-arm64-v8a-py3.14.so $DB/libdart_bridge-android-arm64-v8a-py3.14.so
          d53528f6a8896083330ad7956dfeac7e31e6dfda9dc0ec3be8b867f60c0b4dad dart-bridge/v1.10.0/libdart_bridge-android-x86_64-py3.14.so $DB/libdart_bridge-android-x86_64-py3.14.so
          46f16cddf53095c91a950b1b6ae4bf1525a1c2732c1625dc3410fb6c09aaa6f4 dart-bridge/v1.10.0/libdart_bridge-android-armeabi-v7a-py3.14.so $DB/libdart_bridge-android-armeabi-v7a-py3.14.so
          486dccbbb82b36bac92ce094e92911d6100efb32958dd0f56aa2cab12b5a4391 python-build/manifest-20260921.json $PB/manifest.json
          1a44947dab5eefb30c72ade66e257cdc6b2edcdf6d8e2badea4c42a97d15ac87 build-template/v1.0.1/flet-build-template.zip $FL/flet-build-template.zip
          LISTE
          echo "Android-Laufzeit: $(wc -l < "$RUNNER_TEMP/laufzeit_liste.txt") Dateien vorab geladen und geprueft"

      - name: Signaturschluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 fehlt - ohne festen Schluessel lassen"
            echo "sich spaetere Versionen nicht als Update installieren."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fisi-upload.jks"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/fisi-upload.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: mobile
        env:
          FLET_ANDROID_SIGNING_KEY_ALIAS: upload
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flet build apk --yes --no-rich-output --skip-flutter-doctor

      # Ab 0.63.2 (CI-a, B-E-07): Gradle hat die vorab geladenen Dateien
      # benutzt und nichts selbst geladen oder ersetzt
      - name: Android-Laufzeit unveraendert (nichts nachgeladen)
        run: |
          FEHLER=0
          while read -r SUMME DATEI; do
            ZIEL="$FLET_CACHE_DIR/$DATEI"
            if ! grep -qxF "$(stat -c '%i %Y %s' "$ZIEL") $DATEI" "$RUNNER_TEMP/laufzeit_vorher.txt"; then
              echo "FEHLER: $DATEI wurde waehrend des Baus neu geladen oder ersetzt"
              FEHLER=1
            fi
            if [ "$(sha256sum "$ZIEL" | cut -d' ' -f1)" != "$SUMME" ]; then
              echo "FEHLER: Pruefsumme von $DATEI stimmt nach dem Bau nicht"
              FEHLER=1
            fi
          done < "$RUNNER_TEMP/laufzeit_liste.txt"
          # Keine weiteren Laufzeit-Dateien (andere Python- oder Bridge-Fassung)
          find "$FLET_CACHE_DIR/python-build" "$FLET_CACHE_DIR/dart-bridge" -type f \
            \( -name 'python-android-*' -o -name 'libdart_bridge-*' \) | sort > "$RUNNER_TEMP/laufzeit_gefunden.txt"
          while read -r GEFUNDEN; do
            if ! cut -d' ' -f2 "$RUNNER_TEMP/laufzeit_liste.txt" | grep -qxF "${GEFUNDEN#"$FLET_CACHE_DIR/"}"; then
              echo "FEHLER: Gradle hat eine andere Laufzeit-Datei geladen: ${GEFUNDEN#"$FLET_CACHE_DIR/"}"
              echo "(neue Flet-Fassung? Liste im Schritt \"Android-Laufzeit vorab laden und pruefen\" anpassen)"
              FEHLER=1
            fi
          done < "$RUNNER_TEMP/laufzeit_gefunden.txt"
          if [ "$FEHLER" = 0 ]; then
            echo "Android-Laufzeit: alle $(wc -l < "$RUNNER_TEMP/laufzeit_liste.txt") Dateien unveraendert, nichts nachgeladen"
          fi
          exit "$FEHLER"

      - name: APK umbenennen
        run: |
          VERSION=$(python -c "import build; print(build.app_version())")
          mkdir -p installer_output
          APK=$(ls mobile/build/apk/*.apk | head -n 1)
          cp "$APK" "installer_output/FISI-Lernplattform-${VERSION}-Android.apk"
          ls -l installer_output

      # Ab 0.61 (T10): Paketkennung, Beschriftung und Signaturzertifikat. Nur
      # mit gleichem Paket und gleichem Zertifikat installiert Android die APK
      # als Update der vorhandenen App (Lernstand bleibt).
      - name: APK pruefen (Paket, Beschriftung, Zertifikat wie letztes Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import build; print(build.app_version())")
          ALT=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
          echo "Vergleich mit: $ALT"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 300 -o "$RUNNER_TEMP/alt.apk" "$ALT"
          python pruefung/apk_pruefen.py "installer_output/FISI-Lernplattform-${VERSION}-Android.apk" "$RUNNER_TEMP/alt.apk"

      # Ab 0.62 (Weg B, E5): Lizenzliste der Handy-App mit der neuen APK
      # vergleichen. Rot = Bestandteile haben sich geaendert, die Meldung nennt
      # den Befehl zum Neuerzeugen von mobile/lizenzen_android.txt.
      - name: Lizenzliste der Handy-App pruefen
        run: |
          VERSION=$(python -c "import build; print(build.app_version())")
          python pruefung/lizenzen_android.py "installer_output/FISI-Lernplattform-${VERSION}-Android.apk" --pruefen

      - uses: actions/upload-artifact@v7
        with:
          name: installer-android
          path: installer_output/*
          if-no-files-found: error

  # Ab 0.60 (K-D): die Testsammlung test_*.py. Linux in drei Teilen parallel
  # zu den Bauten, Windows mit einer Auswahl (Windows-eigene Wege). Ohne
  # gruene Tests kein Release und keine Testversion.
  #
  # NOTAUSWEG (nur mit Nicos ausdruecklichem OK): Ist ein Test rot, obwohl
  # das Release dringend raus muss, im Repo unter Settings > Secrets and
  # variables > Actions > Variables die Variable TESTS_UEBERSPRINGEN mit dem
  # Wert "ja" anlegen und im roten Lauf "Re-run failed jobs" waehlen. Dann
  # werden die Test-Jobs uebersprungen und der Release wartet nicht auf sie.
  # Danach die Variable sofort wieder loeschen. Beschrieben in GIT-ANLEITUNG.txt.
  tests:
    name: Tests Linux (${{ matrix.teil }})
    if: vars.TESTS_UEBERSPRINGEN != 'ja'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Ab 0.63.2 (B-A-01): Der Teil "ibus" (Nachstellung mit echtem IBus)
        # laeuft nur im Container (bash pruefung/ci_tests.sh ibus), nicht auf
        # GitHub: Dort haengt Tk ohne Umgehung nicht verlaesslich, der Test
        # beweist dort nichts. Der IBus-Schutz gehoert auf Nicos Testliste
        # (Linux mit IBus).
        teil: [spiel, lang, rest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Ab 0.63.2 (B-M-08): pip-Zwischenspeicher nur in normalen Laeufen,
          # Release-Laeufe bauen ohne Cache (nachvollziehbar)
          cache: ${{ env.IS_RELEASE != 'true' && !inputs.vorab && 'pip' || '' }}
          cache-dependency-path: |
            requirements-lock-tests.txt
            requirements-lock-flet.txt

      - name: Werkzeuge fuer die Tests
        env:
          TEIL: ${{ matrix.teil }}
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y xvfb openbox x11-utils desktop-file-utils \
            hunspell hunspell-de-de

      - name: Abhaengigkeiten (PC und Handy)
        run: |
          python -m pip install --retries 10 --timeout 60 --require-hashes -r requirements-lock-tests.txt
          python -m pip install --retries 10 --timeout 60 --require-hashes -r requirements-lock-flet.txt
          python mobile/vorbereiten.py

      - name: Tests ausfuehren
        env:
          TEIL: ${{ matrix.teil }}
        run: bash pruefung/ci_tests.sh "$TEIL"

  tests-windows:
    name: Tests Windows
    if: vars.TESTS_UEBERSPRINGEN != 'ja'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Ab 0.63.2 (B-M-08): pip-Zwischenspeicher nur in normalen Laeufen,
          # Release-Laeufe bauen ohne Cache (nachvollziehbar)
          cache: ${{ env.IS_RELEASE != 'true' && !inputs.vorab && 'pip' || '' }}
          cache-dependency-path: |
            requirements-lock-tests.txt
            requirements-lock-flet.txt

      - name: Abhaengigkeiten (PC und Handy)
        run: |
          python -m pip install --retries 10 --timeout 60 --require-hashes -r requirements-lock-tests.txt
          python -m pip install --retries 10 --timeout 60 --require-hashes -r requirements-lock-flet.txt
          python mobile/vorbereiten.py

      - name: Tests ausfuehren
        shell: bash
        run: bash pruefung/ci_tests.sh windows

  # Ab 0.56: Update von der letzten normalen Version auf die neue, wie aus dem
  # Programm heraus. Ohne bestandenen Test kein Release und keine Testversion.
  update-test:
    name: Update-Test (Windows)
    needs: build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Ab 0.63.2 (B-M-08): pip-Zwischenspeicher nur in normalen Laeufen,
          # Release-Laeufe bauen ohne Cache (nachvollziehbar)
          cache: ${{ env.IS_RELEASE != 'true' && !inputs.vorab && 'pip' || '' }}
          cache-dependency-path: requirements-lock-certifi.txt

      - name: Alte Version bestimmen (letztes normales Release)
        id: alt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALT=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          NEU=$(python -c "import build; print(build.app_version())")
          echo "alt=${ALT#v}" >> "$GITHUB_OUTPUT"
          echo "neu=$NEU" >> "$GITHUB_OUTPUT"
          echo "Update-Test: ${ALT#v} -> $NEU"

      # Der Updater der alten Version startet den neuen Installer
      - uses: actions/checkout@v7
        with:
          ref: v${{ steps.alt.outputs.alt }}
          path: alt

      - name: Abhaengigkeiten
        run: python -m pip install --retries 10 --timeout 60 --require-hashes -r requirements-lock-certifi.txt

      - uses: actions/download-artifact@v8
        with:
          name: installer-windows
          path: neu

      - name: Update testen
        shell: pwsh
        env:
          ALT_VERSION: ${{ steps.alt.outputs.alt }}
          NEU_VERSION: ${{ steps.alt.outputs.neu }}
        run: |
          $setup = (Get-ChildItem "neu\*Setup*.exe")[0].FullName
          .github\update-test\update_test.ps1 -AltVersion "$env:ALT_VERSION" -NeuVersion "$env:NEU_VERSION" -NeuSetup $setup

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: update-test-protokolle
          path: update_test_protokolle/*

  # Testversion fuer einzelne PCs (ab 0.56): Vorab-Release mit nur der .exe.
  # Tag "vorab-<Name>" beginnt nicht mit v - startet also keinen Release-Lauf.
  # Ab 0.59.1 mit "vorab_dateien: linux-handy" stattdessen nur .deb und APK.
  # Die Windows-Voreinstellung haengt weiter nicht vom Android-Bau ab.
  vorab:
    name: Testversion (Vorab-Release)
    needs: [build, android, update-test, tests, tests-windows]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.vorab != ''
      && needs.build.result == 'success' && needs.update-test.result == 'success'
      && (vars.TESTS_UEBERSPRINGEN == 'ja'
          || (needs.tests.result == 'success' && needs.tests-windows.result == 'success'))
      && (inputs.vorab_dateien != 'linux-handy' || needs.android.result == 'success')
    runs-on: ubuntu-24.04
    # Ab 0.63.2 (B-M-03): Zeitgrenze (der Job braucht unter 1 min)
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        if: inputs.vorab_dateien != 'linux-handy'
        with:
          name: installer-windows
          path: neu

      - uses: actions/download-artifact@v8
        if: inputs.vorab_dateien == 'linux-handy'
        with:
          name: installer-linux
          path: neu

      - uses: actions/download-artifact@v8
        if: inputs.vorab_dateien == 'linux-handy'
        with:
          name: installer-android
          path: neu

      - name: Dateien und Text der Testversion (Linux und Handy)
        if: inputs.vorab_dateien == 'linux-handy'
        env:
          VORAB: ${{ inputs.vorab }}
          ZWECK: ${{ inputs.vorab_zweck }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$VORAB" in *[!A-Za-z0-9._-]*|"") echo "Ungueltiger Name: $VORAB"; exit 1;; esac
          mkdir -p vorab
          # nur die .deb und die APK - kein AppImage, keine anderen Dateien
          cp neu/*.deb neu/*.apk vorab/
          ls -l vorab
          [ "$(ls vorab | wc -l)" = 2 ] || { echo "Erwartet genau 2 Dateien"; exit 1; }
          VERSION=$(python3 -c "import build; print(build.app_version())")
          {
            echo "**Nur zum Testen, nicht veröffentlichen.** Testversion $VORAB, nicht für alle."
            echo ""
            echo "Gebaut aus dem Zweig \`$REF_NAME\` (Stand \`${GITHUB_SHA::7}\`). Intern trägt sie noch die Versionsnummer $VERSION; die neue Nummer wird erst bei der Freigabe gesetzt."
            if [ -n "$ZWECK" ]; then
              echo ""
              echo "Getestet wird: $ZWECK"
            fi
            echo ""
            echo "Die Update-Funktion bietet diese Testversion nicht an (Vorab-Release). Linux: \`sudo apt install --reinstall ./<Dateiname der .deb>\`. Handy: APK öffnen und über die vorhandene App installieren. Der Lernstand bleibt erhalten."
            echo ""
            echo "### Dateien (Name, Größe in Bytes, SHA-256)"
            echo ""
            for f in vorab/*; do
              echo "- \`$(basename "$f")\` · $(stat -c %s "$f") Bytes · \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            done
          } > vorab.md
          cat vorab.md

      - name: Datei und Text der Testversion
        if: inputs.vorab_dateien != 'linux-handy'
        env:
          VORAB: ${{ inputs.vorab }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$VORAB" in *[!A-Za-z0-9._-]*|"") echo "Ungueltiger Name: $VORAB"; exit 1;; esac
          mkdir -p vorab
          cp neu/*Setup*.exe "vorab/FISI-Lernplattform-Setup-$VORAB.exe"
          VERSION=$(python3 -c "import build; print(build.app_version())")
          {
            echo "**Testversion $VORAB - nur zum Prüfen, nicht für alle.**"
            echo ""
            echo "Gebaut aus dem Zweig \`$REF_NAME\` (Stand \`${GITHUB_SHA::7}\`). Intern trägt sie noch die Versionsnummer $VERSION; die neue Nummer wird erst bei der Freigabe gesetzt."
            echo ""
            echo "Die Update-Funktion bietet diese Testversion nicht an (Vorab-Release). Installation von Hand: Datei herunterladen und starten. Der Lernstand bleibt erhalten."
            echo ""
            echo "### Prüfsumme (SHA-256)"
            echo ""
            for f in vorab/*; do
              echo "- \`$(basename "$f")\`: \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            done
          } > vorab.md
          cat vorab.md

      # Ab 0.63.2 (B-M-04): fremde Action auf den Commit festgelegt, auf den
      # v3 am 13.10.2026 zeigte (= v3.0.3, gleicher Code); Dependabot schlaegt
      # neuere Staende als Pull Request vor
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: vorab-${{ inputs.vorab }}
          target_commitish: ${{ github.sha }}
          name: Testversion ${{ inputs.vorab }} (Vorab, nicht für alle)
          body_path: vorab.md
          prerelease: true
          make_latest: false
          files: vorab/*

      - name: Nachweis - neueste Version bleibt das normale Release
        env:
          GH_TOKEN: ${{ github.token }}
          VORAB: ${{ inputs.vorab }}
        run: |
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          PRE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/vorab-$VORAB" --jq .prerelease)
          python3 -m pip install --retries 10 --timeout 60 --quiet --require-hashes -r requirements-lock-certifi.txt
          # ab 0.59.1 fuer alle drei Installationsarten der Testversionen
          ANGEBOT=$(python3 -c "import fisi_update as u; print(' '.join((lambda i: i.version if i else '-')(u.check_for_update('0.1', kind=k)) for k in ('windows', 'deb', 'android')))")
          {
            echo "## Testversion $VORAB"
            echo ""
            echo "| Prüfung | Ergebnis |"
            echo "|---|---|"
            echo "| /releases/latest liefert | $LATEST |"
            echo "| vorab-$VORAB ist Pre-release | $PRE |"
            echo "| Update-Funktion bietet an (ab Version 0.1) | $ANGEBOT |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$LATEST" = "vorab-$VORAB" ] || [ "$PRE" != "true" ] || echo " $ANGEBOT " | grep -qF " $VORAB "; then
            echo "Testversion wuerde als neueste Version ausgeliefert!"
            exit 1
          fi

  release:
    name: GitHub-Release
    needs: [build, android, update-test, tests, tests-windows]
    # Ab 0.60: auch die Tests muessen gruen sein (Notausweg siehe Job "tests")
    if: >-
      !cancelled() && (inputs.tag != '' || startsWith(github.ref, 'refs/tags/v'))
      && needs.build.result == 'success' && needs.android.result == 'success'
      && needs.update-test.result == 'success'
      && (vars.TESTS_UEBERSPRINGEN == 'ja'
          || (needs.tests.result == 'success' && needs.tests-windows.result == 'success'))
    runs-on: ubuntu-24.04
    # Ab 0.63.2 (B-M-03): Zeitgrenze (der Job braucht unter 1 min)
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Versionshinweise aus AENDERUNGEN.md
        run: python3 build.py --versionshinweise > versionshinweise.md

      # Nur die Installer und die APK - nicht die Protokolle des Update-Tests
      # (die landeten bei 0.56 sonst als 6 zusaetzliche Dateien im Release)
      - uses: actions/download-artifact@v8
        with:
          path: installer
          pattern: installer-*
          merge-multiple: true

      # Ab 0.55.1: Hinweis auf die Release-Seite und SHA-256 jeder Datei im
      # Release-Text - bewusst keine zusaetzliche Datei im Release, damit die
      # Zahl der Dateien und die Erkennung durch das Update gleich bleiben.
      - name: Pruefsummen (SHA-256) in den Release-Text
        run: |
          ls -l installer
          echo "Dateien im Release: $(ls installer | wc -l)"
          {
            echo ""
            echo "### Herunterladen"
            echo ""
            echo "Bitte nur die Dateien hier auf der Release-Seite verwenden. Die ZIP-Pakete auf den Seiten der Build-Läufe (Actions, Artifacts) sind nicht für Anwender gedacht und werden von Browsern teils blockiert."
            echo ""
            # Ab 0.59: Hinweis zum AppImage (steht unter "### Herunterladen",
            # also nur auf der Release-Seite, nicht im Update-Fenster)
            echo "**AppImage startet nicht?** Es braucht \`/dev/fuse\` und \`fusermount3\` oder \`fusermount\` (Paket \`fuse3\`, \`fuse2\` bzw. \`fuse\`, je nach System; libfuse2 ist nicht mehr nötig). Ohne Installation geht es mit \`--appimage-extract-and-run\`. Unter Debian/Ubuntu/Mint gibt es das .deb-Paket. Mehr dazu in LIESMICH.txt."
            echo ""
            # Ab 0.61 (E3): Haenger-Befehl beim Entpack-Start (im Container gemessen)
            echo "**Hänger-Befehl beim AppImage:** Beim normalen Start gilt der Befehl aus LIESMICH.txt \`kill -USR1 \$(pgrep -i -x -o fisi-lernplattf)\`. Wer das AppImage mit \`--appimage-extract-and-run\` startet, nimmt \`pgrep -i -x -n fisi-lernplattf\` (n statt o); sonst trifft der Befehl das Startprogramm des AppImage und beendet es."
            echo ""
            # Ab 0.61: macOS ehrlich benennen (kein Mac zum Testen)
            echo "**macOS:** Die Mac-Versionen werden automatisch gebaut und auf Mac-Rechnern von GitHub einmal gestartet und geprüft. Auf einem echten Mac von Menschen getestet sind sie nicht."
            echo ""
            # Ab 0.63: Hinweis zu den Rechtstexten (nur Release-Seite, nicht Update-Fenster)
            echo "**Hinweis:** Die Lizenz- und Rechtstexte dieses Programms sind keine Rechtsberatung und nicht anwaltlich geprüft."
            echo ""
            # Ab 0.59.1: Linux-Absatz zum .deb und Hinweis zum Update-Fenster
            # (ebenfalls unter "### Herunterladen", nicht im Update-Fenster)
            VERSION=$(python3 -c "import build; print(build.app_version())")
            echo "**Linux (Debian, Ubuntu, Mint):** Installieren und aktualisieren geht mit einer Zeile im Terminal, im Ordner der heruntergeladenen Datei: \`sudo apt install ./fisi-lernplattform_${VERSION}_amd64.deb\`. Das App Center kann nur die erste Installation. Es zeigt bei jeder heruntergeladenen .deb-Datei die Warnung „möglicherweise unsicher“ und bei einer schon installierten Version nur ein graues „Installiert“. Entfernen: \`sudo apt remove fisi-lernplattform\`."
            echo ""
            echo "Wer früher selbst eine Startdatei \`fisi-lernplattform.desktop\` in \`~/.local/share/applications/\` angelegt hat (zum Beispiel mit einem frühen Installationsskript), verschiebt sie mit \`mv ~/.local/share/applications/fisi-lernplattform.desktop ~/fisi-lernplattform.desktop.alt\` und meldet sich danach einmal ab und wieder an. Wer so eine Datei nicht hat, muss nichts tun."
            echo ""
            # Nur bei 0.59.1: das neue Update-Fenster kommt aus der installierten
            # Version, wirkt also erst beim Update von 0.59.1 auf die naechste
            if [ "$VERSION" = "0.59.1" ]; then
              echo "**Update-Fenster:** Das neue Fenster „Update verfügbar“ (passt sich der Schriftgröße und kleinen Bildschirmen an, lässt sich vergrößern) erscheint erst beim nächsten Update nach dieser Version. Beim Update auf diese Version zeigt das Programm noch sein altes Fenster."
              echo ""
            fi
            echo "### Prüfsummen (SHA-256)"
            echo ""
            for f in installer/*; do
              echo "- \`$(basename "$f")\`: \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            done
          } >> versionshinweise.md
          cat versionshinweise.md

      # Ab 0.63.2 (B-M-04): fremde Action auf den Commit festgelegt, auf den
      # v3 am 13.10.2026 zeigte (= v3.0.3, gleicher Code); Dependabot schlaegt
      # neuere Staende als Pull Request vor
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Fachinformatiker Lernplattform ${{ env.TAG }}
          body_path: versionshinweise.md
          files: installer/*
