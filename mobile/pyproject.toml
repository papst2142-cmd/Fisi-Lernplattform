# Fachinformatiker Lernplattform - Handy-App (Android), gebaut mit Flet
#
# Bauen (macht GitHub Actions bei jedem Versions-Tag automatisch):
#   python mobile/vorbereiten.py      gemeinsame Dateien nach mobile/src kopieren
#   cd mobile && flet build apk
#
# Version und build_number setzt "python build.py --setze-version <Version>"
# im Hauptordner - nicht von Hand aendern.

[project]
name = "fisi-lernplattform"
version = "0.60.1"
description = "Lernprogramm fuer die Pruefungsvorbereitung zum Fachinformatiker (Schwerpunkt Systemintegration)"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.1",
    "certifi",
]

[tool.flet]
# Ab 0.61: product = Beschriftung unter dem Symbol (kurz, F2). name und org
# ergeben die Paketkennung io.github.papst2142cmd.fisi_lernplattform - NIE AENDERN.
product = "FI Lernplattform"
org = "io.github.papst2142cmd"
company = "Nico H"
build_number = 6001
icon_background = "#120A24"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.splash]
color = "#120A24"
dark_color = "#120A24"

[tool.flet.android]
split_per_abi = false
# Nur 64-Bit-ARM (ab 0.36): laeuft auf dem Samsung S24 und allen neueren Handys.
# Alte 32-Bit-Handys und Emulatoren braucht die App nicht - die APK wird kleiner.
target_arch = ["arm64-v8a"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true

# Ab 0.48.1: jni_flutter 1.0.4 (veroeffentlicht am 01.10.2026) verlangt jni 1.1,
# die Flet-Vorlage legt aber jni 1.0 fest - der APK-Bau bricht dann ab.
# Bis Flet das selbst regelt, bleibt jni_flutter auf der letzten passenden Version.
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.3"
